name: Build
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 27
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '27'
          distribution: 'oracle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: release-nightly
      - name: Set up virtual audio device
        uses: LABSN/sound-ci-helpers@v1.0.4
      - name: Build with Gradle
        run: gradle build
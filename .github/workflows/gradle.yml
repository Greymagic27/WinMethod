name: Build
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 27
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '27'
          distribution: 'oracle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: release-nightly
      - name: Set up virtual audio device
        shell: pwsh
        run: |
            Set-Service audiosrv -StartupType Automatic
            Start-Service audiosrv
            Invoke-WebRequest "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip" -OutFile vbcable.zip
            Expand-Archive vbcable.zip -DestinationPath vbcable
            $cert = (Get-AuthenticodeSignature "vbcable\VBCABLE_Setup_x64.exe").SignerCertificate
            $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPublisher", "LocalMachine")
            $store.Open("ReadWrite"); $store.Add($cert); $store.Close()
            Start-Process "vbcable\VBCABLE_Setup_x64.exe" -ArgumentList "-i", "-h" -Wait
            Start-Sleep -Seconds 5
            Get-CimInstance Win32_SoundDevice | Select-Object Name, Status
      - name: Build with Gradle
        run: gradle build
//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyImplicitNullArgumentCall
plugins {
    id 'java'
    id 'signing'
    id 'net.ltgt.errorprone' version '5.1.0'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.greymagic27'
version = '1.0.7-SNAPSHOT'

repositories {
    mavenCentral()
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
}

signing {
    required = gradle.taskGraph.hasTask("publish")
    useGpgCmd()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(26))
    }
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    implementation 'com.google.errorprone:error_prone_annotations:2.50.0'
    compileOnly 'org.jspecify:jspecify:1.0.1'
    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:deprecation')
    options.errorprone.disable('NoCanIgnoreReturnValueOnClasses')
}
tasks.withType(Javadoc).configureEach {
    options.addStringOption("Xdoclint:-missing", "-quiet")
}
tasks.named("publishToMavenCentral") {
    dependsOn("publishToMavenLocal")
}
tasks.javadoc {
    include("io/github/greymagic27/win_method/platform/**")
    include("io/github/greymagic27/win_method/types/**")
    include("io/github/greymagic27/win_method/methods/**")
    include("io/github/greymagic27/win_method/WinDef/**")
    include("io/github/greymagic27/win_method/WinNT/**")
    include("io/github/greymagic27/win_method/BaseTsd/**")
    include("io/github/greymagic27/win_method/IntSafe/**")
    include("io/github/greymagic27/win_method/Pointer.java")
    include("io/github/greymagic27/win_method/Memory.java")
}
mavenPublishing {
    coordinates(group, "WinMethod", version)
    pom {
        name = "WinMethod"
        description = "Custom JNA like bindings using pure Java"
        inceptionYear = "2026"
        url = "https://github.com/Greymagic27/WinMethod"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "https://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "Greymagic27"
                name = "Greymagic27"
                url = "https://github.com/Greymagic27/WinMethod"
            }
        }
        scm {
            url = "https://github.com/Greymagic27/WinMethod/"
            connection = "scm:git:git://github.com/greymagic27/WinMethod.git"
            developerConnection = "scm:git:ssh://git@github.com/greymagic27/WinMethod.git"
        }
    }
}

abstract class CheckStructSize extends DefaultTask {

    @Inject
    abstract ExecOperations getExecOperations()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void run() {
        def vswhere = "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe"
        def stdout = new ByteArrayOutputStream()
        execOperations.exec {
            commandLine vswhere, "-latest", "-products", "*",
                    "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
                    "-property", "installationPath"
            standardOutput = stdout
        }
        def vsInstallPath = stdout.toString().trim()
        def vcvarsall = "${vsInstallPath}\\VC\\Auxiliary\\Build\\vcvarsall.bat"
        execOperations.exec {
            workingDir "tools"
            commandLine "cmd", "/c", "\"${vcvarsall}\" x64 && cl /EHsc StructureSize.cpp"
        }
        def runOutput = new ByteArrayOutputStream()
        execOperations.exec {
            workingDir "tools"
            commandLine "cmd", "/c", "StructureSize.exe"
            standardOutput = runOutput
        }
        fileSystemOperations.delete { delete "tools/StructureSize.exe", "tools/StructureSize.obj" }
        logger.lifecycle(runOutput.toString())
    }
}

tasks.register("checkStructSize", CheckStructSize)